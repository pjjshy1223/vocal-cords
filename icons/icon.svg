<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D27"/>
      <stop offset="1" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF3DE"/>
      <stop offset="1" stop-color="#3FB9A6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- larynx capsule -->
    <rect x="206" y="96" width="100" height="190" rx="50" fill="none" stroke="url(#mint)" stroke-width="22"/>
    <!-- vibrating cords -->
    <line x1="240" y1="120" x2="240" y2="262" stroke="url(#mint)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <line x1="272" y1="120" x2="272" y2="262" stroke="url(#mint)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <!-- emanating sound waves -->
    <path d="M150 256 a106 106 0 0 0 212 0" fill="none" stroke="url(#mint)" stroke-width="22" stroke-linecap="round"/>
    <path d="M118 256 a138 138 0 0 0 276 0" fill="none" stroke="url(#mint)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <!-- stem + base -->
    <line x1="256" y1="362" x2="256" y2="408" stroke="url(#mint)" stroke-width="22" stroke-linecap="round"/>
    <line x1="200" y1="408" x2="312" y2="408" stroke="url(#mint)" stroke-width="22" stroke-linecap="round"/>
    <!-- "artificial" node accent -->
    <circle cx="362" cy="148" r="16" fill="url(#mint)"/>
    <line x1="306" y1="156" x2="346" y2="150" stroke="url(#mint)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
